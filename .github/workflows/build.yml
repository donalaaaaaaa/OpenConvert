name: OpenConvert CI / Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      run_device_tests:
        description: "Run connected Android tests (needs self-hosted arm64 device)"
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # PRs stay pointer-only. Office / vips blobs are only needed to assemble.
          lfs: ${{ github.event_name != 'pull_request' }}

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew scripts/verify-release-artifacts.sh scripts/package-release.sh scripts/require-lfs-objects.sh scripts/fetch-native-deps.sh

      - name: Verify version scheme
        run: ./gradlew :app:verifyOpenConvertVersion --no-daemon --stacktrace

      - name: Unit tests
        run: ./gradlew testBasicDebugUnitTest testOfficeDebugUnitTest --no-daemon --stacktrace

      - name: Lint
        run: ./gradlew :app:lintBasicDebug :app:lintOfficeDebug --no-daemon --stacktrace

      - name: Require LFS native objects
        if: github.event_name != 'pull_request'
        run: ./scripts/require-lfs-objects.sh

      - name: Require release secrets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          OPENCONVERT_KEYSTORE_BASE64: ${{ secrets.OPENCONVERT_KEYSTORE_BASE64 }}
          OPENCONVERT_STORE_PASSWORD: ${{ secrets.OPENCONVERT_STORE_PASSWORD }}
          OPENCONVERT_KEY_ALIAS: ${{ secrets.OPENCONVERT_KEY_ALIAS }}
          OPENCONVERT_KEY_PASSWORD: ${{ secrets.OPENCONVERT_KEY_PASSWORD }}
        run: ./scripts/verify-release-artifacts.sh --require-secrets

      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          OPENCONVERT_KEYSTORE_BASE64: ${{ secrets.OPENCONVERT_KEYSTORE_BASE64 }}
        run: |
          echo "$OPENCONVERT_KEYSTORE_BASE64" | base64 -d > app/openconvert-release.jks
          test -s app/openconvert-release.jks

      - name: Assemble flavors
        if: github.event_name != 'pull_request'
        env:
          OPENCONVERT_STORE_PASSWORD: ${{ secrets.OPENCONVERT_STORE_PASSWORD }}
          OPENCONVERT_KEY_ALIAS: ${{ secrets.OPENCONVERT_KEY_ALIAS }}
          OPENCONVERT_KEY_PASSWORD: ${{ secrets.OPENCONVERT_KEY_PASSWORD }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ./gradlew assembleBasicRelease assembleOfficeRelease bundleBasicRelease bundleOfficeRelease -PopenconvertRequireReleaseSigning=true --no-daemon --stacktrace
          else
            ./gradlew assembleBasicDebug assembleOfficeDebug assembleBasicRelease assembleOfficeRelease --no-daemon --stacktrace
          fi

      - name: Package release notes and checksums
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ./scripts/package-release.sh --out output-release --tag "${GITHUB_REF_NAME}" --require-aab
          cat output-release/BUILD_INFO.txt
          test -s output-release/RELEASE_NOTES.md
          test -s output-release/SHA256SUMS.txt

      - name: Verify release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          BASIC=output-release/OpenConvert-${GITHUB_REF_NAME}-basic-arm64-v8a.apk
          OFFICE=output-release/OpenConvert-${GITHUB_REF_NAME}-office-arm64-v8a.apk
          if [ ! -f "$BASIC" ] || [ ! -f "$OFFICE" ]; then
            echo "missing packaged release APKs" >&2
            ls -la output-release || true
            exit 1
          fi
          ./scripts/verify-release-artifacts.sh --basic "$BASIC" --office "$OFFICE" --tag "${GITHUB_REF_NAME}"

      - name: Upload build artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: OpenConvert-APKs
          path: |
            app/build/outputs/apk/**/*.apk
            output-release/*

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test, emulator-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download signed artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: OpenConvert-APKs
          path: artifacts

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ ! -d artifacts/output-release ]; then
            echo "output-release missing from artifacts — refusing to publish" >&2
            find artifacts -type f | head
            exit 1
          fi
          if ls artifacts/output-release/*unsigned* >/dev/null 2>&1; then
            echo "unsigned artifact in output-release — refusing to publish" >&2
            ls artifacts/output-release
            exit 1
          fi
          if [ ! -f artifacts/output-release/RELEASE_NOTES.md ]; then
            echo "RELEASE_NOTES.md missing — refusing to publish" >&2
            exit 1
          fi
          if [ ! -f artifacts/output-release/BUILD_INFO.txt ] || [ ! -f artifacts/output-release/SHA256SUMS.txt ]; then
            echo "BUILD_INFO/SHA256SUMS missing — refusing to publish" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/output-release/* --clobber
            gh release edit "$TAG" --notes-file artifacts/output-release/RELEASE_NOTES.md
          else
            gh release create "$TAG" artifacts/output-release/* \
              --title "OpenConvert $TAG" \
              --notes-file artifacts/output-release/RELEASE_NOTES.md
          fi

  # Job-level `if` cannot read `matrix.*` (GitHub evaluates it before expand).
  # PR: API 34 only. main / tag / dispatch: 31 + 34 + 36.
  smoke-matrix:
    name: Smoke matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            matrix='{"include":[{"api-level":34,"target":"default"}]}'
          else
            matrix='{"include":[{"api-level":31,"target":"google_apis"},{"api-level":34,"target":"default"},{"api-level":36,"target":"google_apis"}]}'
          fi
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  # Hosted AVD is x86_64 — Java/Room/Compose smoke, no arm64 native convert.
  emulator-smoke:
    name: x86_64 smoke (API ${{ matrix.api-level }})
    needs: smoke-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.smoke-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented smoke (no native convert)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedBasicDebugAndroidTest -PopenconvertEmulatorAbi=x86_64 -PopenconvertCiSmoke=true --no-daemon --stacktrace

  # Manual only. Suites: Office instrumented (default here),
  # Large File / Force Stop / Native convert stay on the device scripts.
  device-tests:
    name: Device instrumentation
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_device_tests }}
    runs-on: [self-hosted, android, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true
      - name: Grant execute permission
        run: chmod +x gradlew scripts/run-office-instrumented.sh scripts/require-lfs-objects.sh
      - name: Require LFS native objects
        run: ./scripts/require-lfs-objects.sh
      - name: Office instrumented suite
        run: ./scripts/run-office-instrumented.sh
