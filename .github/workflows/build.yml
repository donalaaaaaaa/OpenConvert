name: OpenConvert CI / Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testBasicDebugUnitTest testOfficeDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug & Release APK
        run: ./gradlew assembleBasicDebug assembleOfficeDebug assembleBasicRelease assembleOfficeRelease --no-daemon --stacktrace

      - name: Generate SHA256 Checksums
        run: |
          mkdir -p output-apks
          find app/build/outputs/apk/ -type f -name "*.apk" -exec cp {} output-apks/ \;
          cd output-apks
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenConvert-APKs
          path: output-apks/*
