name: OpenConvert CI / Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      run_device_tests:
        description: "Run connected Android tests (needs self-hosted arm64 device)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify version scheme
        run: ./gradlew :app:verifyOpenConvertVersion --no-daemon --stacktrace

      - name: Unit tests
        run: ./gradlew testBasicDebugUnitTest testOfficeDebugUnitTest --no-daemon --stacktrace

      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          OPENCONVERT_KEYSTORE_BASE64: ${{ secrets.OPENCONVERT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$OPENCONVERT_KEYSTORE_BASE64" ]; then
            echo "OPENCONVERT_KEYSTORE_BASE64 missing — tag build will be unsigned"
            exit 0
          fi
          echo "$OPENCONVERT_KEYSTORE_BASE64" | base64 -d > app/openconvert-release.jks

      - name: Assemble flavors
        env:
          OPENCONVERT_STORE_PASSWORD: ${{ secrets.OPENCONVERT_STORE_PASSWORD }}
          OPENCONVERT_KEY_ALIAS: ${{ secrets.OPENCONVERT_KEY_ALIAS }}
          OPENCONVERT_KEY_PASSWORD: ${{ secrets.OPENCONVERT_KEY_PASSWORD }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ./gradlew assembleBasicRelease assembleOfficeRelease bundleBasicRelease bundleOfficeRelease --no-daemon --stacktrace
          else
            ./gradlew assembleBasicDebug assembleOfficeDebug assembleBasicRelease assembleOfficeRelease --no-daemon --stacktrace
          fi

      - name: Package checksums
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p output-release
          find app/build/outputs/apk -type f -name '*-release.apk' -exec cp {} output-release/ \;
          find app/build/outputs/bundle -type f -name '*.aab' -exec cp {} output-release/ \;
          cd output-release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenConvert-APKs
          path: |
            app/build/outputs/apk/**/*.apk
            output-release/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" output-release/* --clobber
          else
            gh release create "$TAG" output-release/* \
              --title "OpenConvert $TAG" \
              --notes-file release_notes.md
          fi

  emulator-smoke:
    name: x86_64 emulator smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented smoke (no native convert)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedBasicDebugAndroidTest -PopenconvertEmulatorAbi=x86_64 -PopenconvertCiSmoke=true --no-daemon --stacktrace

  device-tests:
    name: Device instrumentation
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_device_tests }}
    runs-on: [self-hosted, android, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Grant execute permission
        run: chmod +x gradlew scripts/run-office-instrumented.sh
      - name: Office instrumented suite
        run: ./scripts/run-office-instrumented.sh
